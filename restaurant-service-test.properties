
# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurantdb
spring.datasource.username=user
spring.datasource.password=user123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Use the current timezone identifier
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


#Actuator info

info.app.name= Restaurant Service
info.app.description= This is Restaurant Service. We are testing right now
info.app.version= 1.0 Under Test
