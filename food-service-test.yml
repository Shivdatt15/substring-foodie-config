server:
  port: 9099

info:
  app:
    name: "Food Service"
    description: "This is Food Service. You are testing this service."
    version: "1.0 Testing"

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jb2404?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: pass123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

#Eureka config

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true